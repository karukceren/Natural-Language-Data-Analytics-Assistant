version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Backend Servisi (RESTful API & Text-to-SQL Motoru)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_data_assistant_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/northwind.db
      - DEBUG=False
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # ---------------------------------------------------------------------------
  # 2. Streamlit Web UI Servisi (Kullanıcı Paneli & Dinamik Grafikler)
  # ---------------------------------------------------------------------------
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_data_assistant_ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/northwind.db
      - DEBUG=False
    volumes:
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy
    command: ["streamlit", "run", "src/ui/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
